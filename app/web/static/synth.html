<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="main.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.0/jquery.min.js"></script>
        <script src="main.js"></script>
        <script type="text/javascript">
            $(function() {
                loadPhotoList("#pictures-section", "Synth");

                window.onhashchange = hashChanged;
                hashChanged();
            });
        </script>
    </head>
    <body>
        <h1 style="text-align: center;">Hybrid Synth</h1>
        <div class="mainContainer">
            <div id="tabs">
                <div class="tab">
                    <a href="#pictures" class="pictures selected">Pictures</a>
                </div>
                |
                <div class="tab">
                    <a href="#videos" class="videos">Videos</a>
                </div>
                |
                <div class="tab">
                    <a href="https://github.com/alexscarlatos/hybrid-synth" target="_blank">GitHub</a>
                </div>
            </div>
            <div id="sectionContainer">
                <div class="section centered" id="pictures-section">
                </div>

                <div class="section centered" id="videos-section" style="display:none;">
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/FhELPgn3KO0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
            <!-- <div id="footer">
                Copyright 2020 Alex Scarlatos
            </div> -->
        </div>
    </body>
</html>

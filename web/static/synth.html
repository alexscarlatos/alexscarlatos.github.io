<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="main.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.0/jquery.min.js"></script>
        <script src="main.js"></script>
        <script type="text/javascript">
            $(function() {
                loadPhotoList("#pictures", "Synth");
            });
        </script>
    </head>
    <body>
        <h1 style="text-align: center;">Hybrid Synth</h1>
        <div class="mainContainer">
            <div id="tabs">
                <div class="tab">
                    <a href="#" onclick="openSection('#pictures', $(this));" class="selected">Pictures</a>
                </div>
                |
                <div class="tab">
                    <a href="#" onclick="openSection('#videos', $(this));">Videos</a>
                </div>
                |
                <div class="tab">
                    <a href="#" onclick="openSection('#documents', $(this));">Documents</a>
                </div>
            </div>
            <div id="sectionContainer">
                <div class="section centered" id="pictures">
                </div>

                <div class="section centered" id="videos" style="display:none;">
                    <video width="300" height="533" controls>
                        <source src="videos/Synth/IMG_3851.m4v" type="video/mp4">
                    </video>
                    <video width="300" height="533" controls>
                        <source src="videos/Synth/IMG_3859.m4v" type="video/mp4">
                    </video>
                    <video width="300" height="533" controls>
                        <source src="videos/Synth/IMG_3867.m4v" type="video/mp4">
                    </video>
                    <video width="300" height="533" controls>
                        <source src="videos/Synth/IMG_3869.m4v" type="video/mp4">
                    </video>
                </div>

                <div class="section centered" id="documents"  style="display:none;">
                    <h2 class="document"><a href="documents/Synth Abstract.pdf" target="_blank">Abstract</a></h2>
                    <h2 class="document"><a href="documents/Synth Poster.pdf" target="_blank">Poster</a></h2>
                </div>
            </div>
            <div id="footer">
                Copyright 2018 Alex Scarlatos
            </div>
        </div>
    </body>
</html>
